[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/ssh",
    "crates/metrics",
    "crates/plugins",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sshflow/sshflow"
authors = ["Giuseppe Marchese"]

[workspace.dependencies]
sshflow-core = { path = "crates/core" }
sshflow-config = { path = "crates/config" }
sshflow-ssh = { path = "crates/ssh" }
sshflow-metrics = { path = "crates/metrics" }
sshflow-plugins = { path = "crates/plugins" }

clap = { version = "=4.4.18", features = ["derive"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "process", "fs", "signal", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
directories = "5.0"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
sysinfo = { version = "0.30", default-features = false }
rand = "0.8"
indexmap = "=2.2.6"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
